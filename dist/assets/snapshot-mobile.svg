<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title desc"><title id="title">一致快照的两条时间泳道</title><desc id="desc">时间向下，P1先记录3枚，P2发送消息m后记录2枚，m记录在通道中1枚，合计6。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#314f43"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#aa5944"/></marker></defs><rect width="360" height="440" rx="5" fill="#f1f4ec"/><g fill="#29372f" font-family="Microsoft YaHei,sans-serif" font-size="13"><text x="25" y="29" fill="#6f786f" font-size="11">时间向下推进 · 虚线为快照标记</text><text x="70" y="59" text-anchor="middle" font-size="17">P1</text><text x="280" y="59" text-anchor="middle" font-size="17">P2</text><rect x="55" y="88" width="30" height="244" rx="3" fill="#dce6d7"/><g stroke="#8c9b89" stroke-width="1.4" marker-end="url(#a)"><path d="M70 70V360"/><path d="M280 70V360"/></g><g stroke="#314f43" stroke-width="2"><path d="M55 90H85"/><path d="M265 217H295"/></g><text x="92" y="93">记录 P1：3 枚</text><text x="171" y="234">记录 P2：2 枚</text><g fill="none" stroke="#314f43" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#a)"><path d="M70 110 280 217"/><path d="M280 249 70 332"/></g><text x="145" y="138" fill="#52644e">标记</text><text x="186" y="304" fill="#52644e">标记</text><path d="M280 155 70 269" fill="none" stroke="#aa5944" stroke-width="2.2" marker-end="url(#b)"/><rect x="105" y="175" width="133" height="25" rx="3" fill="#eee5d9"/><text x="113" y="192" fill="#874a38">业务消息 m：1 枚</text><circle cx="70" cy="269" r="5" fill="#aa5944"/><text x="95" y="277" font-size="12" fill="#874a38">记录到通道中</text><g fill="#fff" stroke="#d8dfd2"><rect x="20" y="380" width="96" height="38" rx="3"/><rect x="122" y="380" width="96" height="38" rx="3"/><rect x="224" y="380" width="116" height="38" rx="3"/></g><text x="68" y="404" text-anchor="middle">P1：3</text><text x="170" y="404" text-anchor="middle">P2：2</text><text x="282" y="404" text-anchor="middle">通道：1</text></g></svg>
