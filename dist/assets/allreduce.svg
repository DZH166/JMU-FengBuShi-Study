<svg xmlns="http://www.w3.org/2000/svg" width="340" height="270" viewBox="0 0 340 270" role="img" aria-labelledby="t"><title id="t">AllReduce使各节点取得共同梯度，再各自更新参数</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#314f43"/></marker></defs><rect width="340" height="270" rx="5" fill="#f1f4ec"/><g fill="#29372f" font-family="Microsoft YaHei,sans-serif" font-size="13"><text x="20" y="29" font-size="15">AllReduce / 各 Worker 更新 W</text><g fill="#fff" stroke="#d8dfd2"><rect x="20" y="52" width="135" height="65" rx="4"/><rect x="185" y="52" width="135" height="65" rx="4"/></g><text x="87" y="74" text-anchor="middle">A：W = 10</text><text x="87" y="100" text-anchor="middle">本地梯度：2</text><text x="252" y="74" text-anchor="middle">B：W = 10</text><text x="252" y="100" text-anchor="middle">本地梯度：4</text><g stroke="#314f43" fill="none" stroke-width="1.8" marker-end="url(#a)"><path d="M87 119V152"/><path d="M252 119V152"/><path d="M87 186V215"/><path d="M252 186V215"/></g><rect x="40" y="153" width="260" height="35" rx="4" fill="#dce6d7"/><text x="170" y="176" text-anchor="middle">归约后，各自得到 (2 + 4) / 2 = 3</text><g fill="#fff" stroke="#d8dfd2"><rect x="20" y="216" width="135" height="31" rx="4"/><rect x="185" y="216" width="135" height="31" rx="4"/></g><text x="87" y="237" text-anchor="middle">本地更新：9.7</text><text x="252" y="237" text-anchor="middle">本地更新：9.7</text></g></svg>
